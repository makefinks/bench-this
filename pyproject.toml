[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-this"
version = "0.1.0"
description = "Benchmark coding agents on your codebase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.1,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
agent-bench = "agent_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_bench = ["template/**/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
